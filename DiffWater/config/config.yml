data:
    dataset: "EUVP"
    image_size: 128
    channels: 3
    num_workers: 2
    data_dir: "/content/drive/My Drive/FoundationModel-Assignment/UW-DiffPhys/data/EUVP"
    conditional: True
    val_ratio: 0.10

tb_path: "/content/drive/My Drive/FoundationModel-Assignment/UW-DiffPhys/logs/EUVP"

model:
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1, 1, 2, 3, 4]
    num_res_blocks: 2
    attn_resolutions: [16]
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

training:
    batch_size: 4
    n_epochs: 100
    snapshot_freq: 1000
    validation_freq: 1000

sampling:
    batch_size: 4
    last_only: True

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.00002
    amsgrad: False
    eps: 0.00000001
